name: Daily independent backup
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: forshor-independent-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'zapatacomputing/forshor-submissions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout trusted backup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Check backup integrity and restore safeguards
        run: python3 -m unittest discover -s scripts/backups -p 'test_*.py'
      - name: Obtain short-lived backup identity
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/769861884059/locations/global/workloadIdentityPools/forshor-backup/providers/github
          service_account: forshor-backup-submissions@quantum-pilot-services.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Back up submission Git history, archive, and PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          BACKUP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/backups/backup.py run submissions --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
