name: Check contributor CLI and publication reporting
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: Maintenance checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest==9.1.1
      - run: python3 -m pytest scripts/test_check_banded_policy_fast.py -q
      - run: python3 -m pytest evaluation/test_archive_policy.py -q
      - run: python3 -m unittest evaluation/test_summary_tex.py
      - run: python3 scripts/test_contributor_cli.py
      - run: python3 -m py_compile forshor
      - run: node scripts/test_report_trust.js
      - run: node --test scripts/test_submission_admission.js
      - run: node --test scripts/test_publication.js scripts/test_pr_publication.js scripts/test_policy_publication.js scripts/test_notify_submitters.js scripts/test_submission_citation.js
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/backups -p 'test_*.py'
      - run: python3 scripts/test_policy_verifier.py
